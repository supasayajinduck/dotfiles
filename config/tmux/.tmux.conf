###############################################################################
# Dotfiles Tmux configuration
#
# Description:
#   Configuration Tmux sobre et orientée administration système.
#   Compatible avec Debian, Ubuntu et Rocky Linux.
#
# Préfixe conservé:
#   Ctrl+B
###############################################################################

###############################################################################
# Comportement général
###############################################################################

# Utiliser une numérotation commençant à 1 pour les fenêtres et les panneaux.
set-option -g base-index 1
set-window-option -g pane-base-index 1

# Renuméroter automatiquement les fenêtres après la fermeture de l'une d'elles.
set-option -g renumber-windows on

# Augmenter la taille de l'historique.
set-option -g history-limit 50000

# Réduire le délai après l'utilisation du préfixe Tmux.
set-option -s escape-time 10

# Augmenter la fréquence de mise à jour de la barre de statut.
set-option -g status-interval 5

# Activer la prise en charge de la souris.
set-option -g mouse on

# Conserver une fenêtre ouverte lorsqu'une commande se termine anormalement.
set-window-option -g remain-on-exit failed

###############################################################################
# Terminal et couleurs
###############################################################################

# Déclarer un terminal compatible 256 couleurs à l'intérieur de Tmux.
set-option -g default-terminal "tmux-256color"

# Activer les couleurs RGB lorsque le terminal les prend en charge.
set-option -as terminal-features ",xterm-256color:RGB"

###############################################################################
# Nom des fenêtres
###############################################################################

# Permettre à Tmux de nommer automatiquement les fenêtres.
set-option -g automatic-rename on

# Autoriser les programmes comme SSH ou Vim à modifier le titre de la fenêtre.
set-option -g allow-rename on

###############################################################################
# Découpage des panneaux
###############################################################################

# Créer un panneau horizontal dans le répertoire courant.
bind-key | split-window -h -c "#{pane_current_path}"

# Créer un panneau vertical dans le répertoire courant.
bind-key - split-window -v -c "#{pane_current_path}"

# Conserver les raccourcis standards avec le répertoire courant.
bind-key '"' split-window -v -c "#{pane_current_path}"
bind-key % split-window -h -c "#{pane_current_path}"

###############################################################################
# Navigation entre les panneaux
###############################################################################

# Naviguer entre les panneaux avec le préfixe suivi de Alt+Flèche.
bind-key -n M-Left select-pane -L
bind-key -n M-Right select-pane -R
bind-key -n M-Up select-pane -U
bind-key -n M-Down select-pane -D

# Naviguer avec le préfixe suivi des touches Vim.
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

###############################################################################
# Redimensionnement des panneaux
###############################################################################

# Redimensionner les panneaux avec le préfixe suivi de H, J, K ou L.
bind-key -r H resize-pane -L 5
bind-key -r J resize-pane -D 5
bind-key -r K resize-pane -U 5
bind-key -r L resize-pane -R 5

###############################################################################
# Gestion des fenêtres et panneaux
###############################################################################

# Créer une nouvelle fenêtre dans le répertoire courant.
bind-key c new-window -c "#{pane_current_path}"

# Demander une confirmation avant de fermer une fenêtre.
bind-key & confirm-before -p "Fermer la fenêtre #W ? (y/n)" kill-window

# Demander une confirmation avant de fermer un panneau.
bind-key x confirm-before -p "Fermer le panneau #P ? (y/n)" kill-pane

# Basculer rapidement vers la dernière fenêtre utilisée.
bind-key Space last-window

###############################################################################
# Mode copie
###############################################################################

# Utiliser les raccourcis Vim dans le mode copie.
set-window-option -g mode-keys vi

# Commencer la sélection avec v.
bind-key -T copy-mode-vi v send-keys -X begin-selection

# Sélectionner une ligne complète avec V.
bind-key -T copy-mode-vi V send-keys -X select-line

# Copier la sélection dans le buffer interne de Tmux avec y.
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Entrer en mode copie avec le préfixe suivi de la touche [.
bind-key [ copy-mode

###############################################################################
# Rechargement de la configuration
###############################################################################

# Recharger la configuration avec Ctrl+B puis r.
bind-key r source-file "${HOME}/.tmux.conf" \; display-message "Configuration Tmux rechargée"

###############################################################################
# Barre de statut
###############################################################################

# Afficher la barre de statut en bas.
set-option -g status-position bottom

# Couleurs générales de la barre de statut.
set-option -g status-style "bg=colour234,fg=colour250"

# Style des fenêtres inactives.
set-window-option -g window-status-style "bg=colour234,fg=colour244"

# Style de la fenêtre active.
set-window-option -g window-status-current-style "bg=colour31,fg=colour231,bold"

# Séparateur entre les fenêtres.
set-option -g window-status-separator " "

# Contenu affiché pour une fenêtre inactive.
set-window-option -g window-status-format " #I:#W "

# Contenu affiché pour la fenêtre active.
set-window-option -g window-status-current-format " #I:#W "

# Informations affichées à gauche.
set-option -g status-left-length 40
set-option[ copy-mode

chargement de la configurationefault]"

# Informations affichées à droite.
set-option -g status-right-length 100
set-option -g status-right "#[fg=colour244]#H #[fg=colour39]%Y-%m-%d %H:%M "

###############################################################################
# Messages et panneaux
###############################################################################

# Style des messages Tmux.
set-option -g message-style "bg=colour31,fg=colour231,bold"

# Bordure des panneaux inactifs.
set-option -g pane-border-style "fg=colour238"

# Bordure du panneau actif.
set-option -g pane-active-border-style "fg=colour39"

# Affichage temporaire du numéro des panneaux.
set-option -g display-panes-time 1500

# Durée d'affichage des messages.
set-option -g display-time 3000

###############################################################################
# Activité et notifications
###############################################################################

# Surveiller silencieusement l'activité dans les fenêtres.
set-window-option -g monitor-activity on
set-option -g visual-activity off

# Mettre en évidence une fenêtre contenant une activité.
set-window-option -g window-status-activity-style "fg=colour214,bg=colour234,bold"
