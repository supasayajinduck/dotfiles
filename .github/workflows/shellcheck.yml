---
name: Validate shell scripts

on:
  push:
    branches:
      - main
    paths:
      - "**/*.sh"
      - ".github/workflows/shellcheck.yml"

  pull_request:
    branches:
      - main
    paths:
      - "**/*.sh"
      - ".github/workflows/shellcheck.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shellcheck-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-shell:
    name: Bash validation and smoke tests
    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install ShellCheck
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck

      - name: Display ShellCheck version
        shell: bash
        run: shellcheck --version

      - name: Validate Bash syntax
        shell: bash
        run: |
          bash -n install.sh
          bash -n uninstall.sh

      - name: Run non-destructive smoke tests
        shell: bash
        run: |
          TEST_HOME="${RUNNER_TEMP}/dotfiles-test-home"
          mkdir -p "$TEST_HOME"

          echo "Testing install.sh help"
          HOME="$TEST_HOME" bash install.sh --help > /dev/null

          echo "Testing base package listing"
          HOME="$TEST_HOME" bash install.sh --list-packages > /dev/null

          echo "Testing admin package listing"
          HOME="$TEST_HOME" bash install.sh --admin --list-packages > /dev/null

          echo "Testing uninstall.sh help"
          HOME="$TEST_HOME" bash uninstall.sh --help > /dev/null

          echo "Testing backup listing"
          HOME="$TEST_HOME" bash uninstall.sh --list-backups > /dev/null

          echo "All non-destructive smoke tests passed"

      - name: Run ShellCheck
        shell: bash
        run: |
          shellcheck \
            --shell=bash \
            --severity=style \
            install.sh \
            uninstall.sh
