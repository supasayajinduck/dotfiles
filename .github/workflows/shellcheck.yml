---
name: Validate shell scripts

on:
  push:
    branches:
      - main
    paths:
      - "**/*.sh"
      - ".github/workflows/shellcheck.yml"

  pull_request:
    branches:
      - main
    paths:
      - "**/*.sh"
      - ".github/workflows/shellcheck.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dotfiles-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-shell:
    name: Bash validation and smoke tests
    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install ShellCheck
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck

      - name: Display ShellCheck version
        shell: bash
        run: shellcheck --version

      - name: Validate Bash syntax
        shell: bash
        run: |
          bash -n install.sh
          bash -n uninstall.sh

      - name: Run non-destructive smoke tests
        shell: bash
        run: |
          TEST_HOME="${RUNNER_TEMP}/dotfiles-test-home"
          mkdir -p "$TEST_HOME"

          echo "Testing install.sh help"
          HOME="$TEST_HOME" bash install.sh --help > /dev/null

          echo "Testing base package listing"
          HOME="$TEST_HOME" bash install.sh --list-packages > /dev/null

          echo "Testing admin package listing"
          HOME="$TEST_HOME" bash install.sh --admin --list-packages > /dev/null

          echo "Testing uninstall.sh help"
          HOME="$TEST_HOME" bash uninstall.sh --help > /dev/null

          echo "Testing backup listing"
          HOME="$TEST_HOME" bash uninstall.sh --list-backups > /dev/null

          echo "All non-destructive smoke tests passed"

      - name: Run ShellCheck
        shell: bash
        run: |
          shellcheck \
            --shell=bash \
            --severity=style \
            install.sh \
            uninstall.sh

  test-distributions:
    name: Test ${{ matrix.name }}
    needs: validate-shell
    runs-on: ubuntu-latest

    timeout-minutes: 15

    strategy:
      fail-fast: false

      matrix:
        include:
          - name: Ubuntu 24.04
            image: ubuntu:24.04
            expected-id: ubuntu

          - name: Debian 12
            image: debian:12
            expected-id: debian

          - name: Rocky Linux 9
            image: rockylinux/rockylinux:9
            expected-id: rocky

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Pull container image
        shell: bash
        run: docker pull "${{ matrix.image }}"

      - name: Verify distribution identity
        shell: bash
        run: |
          detected_id="$(
            docker run --rm \
              "${{ matrix.image }}" \
              bash -c '. /etc/os-release && printf "%s" "$ID"'
          )"

          echo "Expected distribution ID: ${{ matrix.expected-id }}"
          echo "Detected distribution ID: ${detected_id}"

          if [[ "$detected_id" != "${{ matrix.expected-id }}" ]]; then
            echo "Unexpected distribution ID" >&2
            exit 1
          fi

      - name: Validate Bash syntax in container
        shell: bash
        run: |
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/workspace:ro" \
            --workdir /workspace \
            "${{ matrix.image }}" \
            bash -n install.sh

          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/workspace:ro" \
            --workdir /workspace \
            "${{ matrix.image }}" \
            bash -n uninstall.sh

      - name: Test installer options
        shell: bash
        run: |
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/workspace:ro" \
            --workdir /workspace \
            --env HOME=/tmp/dotfiles-test-home \
            "${{ matrix.image }}" \
            bash -c '
              mkdir -p "$HOME"
              bash install.sh --help > /dev/null
              bash install.sh --list-packages > /dev/null
              bash install.sh --admin --list-packages > /dev/null
              bash install.sh --all --list-packages > /dev/null
            '

      - name: Test uninstaller options
        shell: bash
        run: |
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/workspace:ro" \
            --workdir /workspace \
            --env HOME=/tmp/dotfiles-test-home \
            "${{ matrix.image }}" \
            bash -c '
              mkdir -p "$HOME"
              bash uninstall.sh --help > /dev/null
              bash uninstall.sh --list-backups > /dev/null
            '
      - name: Test dotfiles lifecycle
        shell: bash
        run: |
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/workspace:ro" \
            --workdir /workspace \
            --env HOME=/tmp/dotfiles-test-home \
            "${{ matrix.image }}" \
            bash -c '
              set -Eeuo pipefail

              marker_start="# >>> dotfiles managed block >>>"
              marker_end="# <<< dotfiles managed block <<<"

              mkdir -p "$HOME"

              echo "# Existing Bash configuration" > "$HOME/.bashrc"
              echo "export EXISTING_SETTING=preserved" >> "$HOME/.bashrc"

              echo "Running first dotfiles installation"
              bash install.sh --dotfiles-only

              echo "Checking symbolic links"

              test -L "$HOME/.bash_aliases"
              test -L "$HOME/.tmux.conf"
              test -L "$HOME/.vimrc"

              test "$(readlink -f "$HOME/.bash_aliases")" = \
                   "/workspace/config/bash/.bash_aliases"

              test "$(readlink -f "$HOME/.tmux.conf")" = \
                   "/workspace/config/tmux/.tmux.conf"

              test "$(readlink -f "$HOME/.vimrc")" = \
                   "/workspace/config/vim/.vimrc"

              echo "Checking managed Bash block"

              test "$(grep -Fc "$marker_start" "$HOME/.bashrc")" -eq 1
              test "$(grep -Fc "$marker_end" "$HOME/.bashrc")" -eq 1

              grep -Fq \
                "export EXISTING_SETTING=preserved" \
                "$HOME/.bashrc"

              echo "Checking installation backup"

              backup_count="$(
                find "$HOME/.dotfiles-backup" \
                  -mindepth 1 \
                  -maxdepth 1 \
                  -type d |
                wc -l
              )"

              test "$backup_count" -ge 1

              echo "Running second dotfiles installation"
              bash install.sh --dotfiles-only

              echo "Checking idempotence"

              test "$(grep -Fc "$marker_start" "$HOME/.bashrc")" -eq 1
              test "$(grep -Fc "$marker_end" "$HOME/.bashrc")" -eq 1

              test -L "$HOME/.bash_aliases"
              test -L "$HOME/.tmux.conf"
              test -L "$HOME/.vimrc"

              echo "Running dotfiles uninstallation"
              bash uninstall.sh

              echo "Checking removed symbolic links"

              test ! -e "$HOME/.bash_aliases"
              test ! -L "$HOME/.bash_aliases"

              test ! -e "$HOME/.tmux.conf"
              test ! -L "$HOME/.tmux.conf"

              test ! -e "$HOME/.vimrc"
              test ! -L "$HOME/.vimrc"

              echo "Checking cleaned Bash configuration"

              test "$(grep -Fc "$marker_start" "$HOME/.bashrc" || true)" -eq 0
              test "$(grep -Fc "$marker_end" "$HOME/.bashrc" || true)" -eq 0

              grep -Fq \
                "export EXISTING_SETTING=preserved" \
                "$HOME/.bashrc"

              echo "Dotfiles lifecycle test passed"
            '

      - name: Display test result
        shell: bash
        run: |
          echo "Non-destructive tests passed on ${{ matrix.name }}"
