---
name: Validate shell scripts

on:
  push:
    branches:
      - main
    paths:
      - "**/*.sh"
      - ".github/workflows/shellcheck.yml"

  pull_request:
    branches:
      - main
    paths:
      - "**/*.sh"
      - ".github/workflows/shellcheck.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shellcheck-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-shell:
    name: Bash syntax and ShellCheck
    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ShellCheck
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck

      - name: Display ShellCheck version
        shell: bash
        run: shellcheck --version

      - name: Validate Bash syntax
        shell: bash
        run: |
          bash -n install.sh
          bash -n uninstall.sh

      - name: Run ShellCheck
        shell: bash
        run: |
          shellcheck \
            --shell=bash \
            --severity=style \
            install.sh \
            uninstall.sh
